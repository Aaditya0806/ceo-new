<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Manager — CEO HR Consultancy</title>
  <link rel="shortcut icon" href="/assets/favicon/favicon.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #FF7A01;
      --brand-dark: #e56e00;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #e6e8ec;
      --text: #1d2330;
      --text-soft: #5d6470;
      --text-muted: #8a93a3;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --info: #2563eb;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }
    button { font-family: inherit; cursor: pointer; }
    input, textarea, select { font-family: inherit; font-size: 14px; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ---------- Loading ---------- */
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); z-index: 9999;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #d8dbe0; border-top-color: var(--brand);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Login ---------- */
    #login {
      min-height: 100vh; display: none;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--panel);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 32px;
      width: 100%; max-width: 380px;
    }
    .login-card h1 {
      font-size: 22px; margin: 0 0 6px;
    }
    .login-card .sub {
      color: var(--text-soft); margin: 0 0 24px; font-size: 13px;
    }
    .login-card label {
      display: block;
      font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-soft); margin: 14px 0 6px;
    }
    .login-card input {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      background: #fff; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .login-card input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(255, 122, 1, .15);
    }
    .login-card button[type=submit] {
      width: 100%; margin-top: 22px;
      padding: 11px 14px;
      background: var(--brand); color: #fff;
      border: 0; border-radius: 8px;
      font-weight: 600; font-size: 14px;
      transition: background .15s;
    }
    .login-card button[type=submit]:hover { background: var(--brand-dark); }
    .login-card button[type=submit]:disabled { opacity: .6; cursor: not-allowed; }
    .login-error {
      margin-top: 14px; padding: 10px 12px;
      background: var(--danger-bg); color: var(--danger);
      border-radius: 8px; font-size: 13px;
      display: none;
    }
    .login-success {
      margin-top: 14px; padding: 10px 12px;
      background: var(--success-bg); color: var(--success);
      border-radius: 8px; font-size: 13px;
      display: none;
    }
    .forgot {
      display: inline-block; margin-top: 12px;
      font-size: 12px; color: var(--text-soft);
      cursor: pointer;
    }
    .forgot:hover { color: var(--brand); text-decoration: underline; }

    /* ---------- Admin shell ---------- */
    #app { display: none; min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center;
      gap: 12px; padding: 10px 20px;
      background: #fff; border-bottom: 1px solid var(--border);
    }
    .topbar .logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 16px; color: var(--text);
    }
    .topbar .logo img { width: 28px; height: 28px; object-fit: contain; }
    .topbar .spacer { flex: 1; }
    .save-status {
      font-size: 13px; padding: 6px 12px; border-radius: 999px;
      background: var(--success-bg); color: var(--success);
    }
    .save-status.dirty { background: #fff7e6; color: #b45309; }
    .save-status.saving { background: #e0f2fe; color: var(--info); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: #fff;
      font-size: 13px; font-weight: 500; color: var(--text);
      transition: background .15s, border-color .15s;
    }
    .btn:hover { background: #f8f9fb; }
    .btn-primary {
      background: var(--brand); color: #fff; border-color: var(--brand);
    }
    .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
    .btn-danger {
      background: #fff; color: var(--danger); border-color: #fecaca;
    }
    .btn-danger:hover { background: var(--danger-bg); }
    .btn-icon { padding: 6px 8px; font-size: 12px; }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0;
      min-height: calc(100vh - 53px);
    }
    .sidebar {
      background: #fff; border-right: 1px solid var(--border);
      padding: 20px 12px; overflow-y: auto;
      max-height: calc(100vh - 53px); position: sticky; top: 53px;
    }
    .sidebar .group-title {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-muted);
      padding: 14px 12px 6px;
    }
    .nav-item {
      display: block; padding: 8px 12px; margin: 2px 0;
      border-radius: 8px; cursor: pointer;
      color: var(--text-soft); font-size: 13.5px;
      transition: background .12s, color .12s;
    }
    .nav-item:hover { background: #f5f6f8; color: var(--text); }
    .nav-item.active {
      background: #fff3e6; color: var(--brand); font-weight: 500;
    }

    .main {
      padding: 28px 36px 60px;
      max-width: 980px;
    }
    .page-title {
      margin: 0 0 4px; font-size: 22px; font-weight: 700;
    }
    .page-sub {
      color: var(--text-soft); margin: 0 0 18px; font-size: 13px;
    }
    .info-banner {
      padding: 12px 16px; border-radius: 8px;
      background: #fff7e6; border: 1px solid #ffe2b8;
      color: #5b3b00; font-size: 13px; margin: 0 0 22px;
    }
    .info-banner b { color: #7a4a00; }

    .section-title {
      margin: 28px 0 12px; font-size: 16px; font-weight: 700;
    }
    .field-card {
      background: #fff; border: 1px solid var(--border);
      border-radius: 10px; padding: 16px 18px;
      margin-bottom: 14px;
    }
    .field-card-head {
      font-size: 14px; font-weight: 600;
      margin: -2px 0 12px; color: var(--text);
    }
    .field {
      display: block; margin-bottom: 12px;
    }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--text-soft); margin: 0 0 6px;
    }
    .field input[type=text],
    .field input[type=url],
    .field input[type=email],
    .field textarea {
      width: 100%; padding: 9px 11px;
      border: 1px solid var(--border); border-radius: 8px;
      background: #fff; outline: none;
      transition: border-color .15s, box-shadow .15s;
      color: var(--text);
    }
    .field input:focus, .field textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(255, 122, 1, .12);
    }
    .field textarea { min-height: 78px; resize: vertical; }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 720px) {
      .field-row { grid-template-columns: 1fr; }
    }

    /* Image field */
    .img-field {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 12px; align-items: start;
    }
    .img-preview {
      width: 110px; height: 110px;
      background: #f1f3f5; border: 1px dashed var(--border);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      overflow: hidden; color: var(--text-muted); font-size: 11px;
    }
    .img-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .img-controls input { width: 100%; }
    .img-controls .upload {
      margin-top: 6px;
    }
    .img-controls .upload-status { font-size: 12px; color: var(--text-muted); margin-left: 8px; }

    /* List */
    .list-wrap {
      border: 1px solid var(--border); border-radius: 10px;
      background: #fff;
    }
    .list-item {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
    }
    .list-item:last-child { border-bottom: 0; }
    .list-item-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .list-item-title {
      font-weight: 600; font-size: 13px; color: var(--text);
      flex: 1;
    }
    .list-actions {
      display: flex; gap: 4px;
    }
    .list-add-btn {
      margin: 12px 0 0;
    }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 18px; border-radius: 10px;
      background: #1d2330; color: #fff; font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      opacity: 0; transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none; z-index: 1000;
      max-width: 360px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: var(--success); }
    #toast.error { background: var(--danger); }

    /* Mobile */
    .menu-toggle { display: none; }
    @media (max-width: 880px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: static; max-height: none;
        border-right: 0; border-bottom: 1px solid var(--border);
        padding: 12px;
        display: none;
      }
      .sidebar.open { display: block; }
      .menu-toggle {
        display: inline-flex; align-items: center; justify-content: center;
        width: 36px; height: 36px;
        border: 1px solid var(--border); border-radius: 8px;
        background: #fff; padding: 0;
      }
      .main { padding: 18px 16px 50px; }
      .topbar { padding: 8px 12px; }
      .topbar .logo { font-size: 14px; }
      .save-status { display: none; }
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading"><div class="spinner"></div></div>

  <!-- Login -->
  <div id="login">
    <form class="login-card" id="login-form" autocomplete="on">
      <h1>Content Manager</h1>
      <p class="sub">Sign in to edit your website content.</p>
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" required />
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required />
      <button type="submit" id="login-btn">Sign in</button>
      <a class="forgot" id="forgot-link">Forgot password?</a>
      <div class="login-error" id="login-error"></div>
      <div class="login-success" id="login-success"></div>
    </form>
  </div>

  <!-- Admin -->
  <div id="app">
    <div class="topbar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="logo">
        <img src="/assets/logo.png" alt="" />
        <span>Content Manager</span>
      </div>
      <div class="spacer"></div>
      <span class="save-status" id="save-status">All changes saved</span>
      <a class="btn" id="view-site" href="/" target="_blank" rel="noopener">View site</a>
      <button class="btn btn-primary" id="publish-btn">Publish</button>
      <button class="btn" id="logout-btn">Logout</button>
    </div>

    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main"></main>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/supabase-config.js"></script>
  <script type="module" src="/admin.js"></script>
</body>
</html>
